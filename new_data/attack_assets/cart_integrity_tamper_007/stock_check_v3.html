<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stock check — The Boys in the Boat</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#f7f7f7;color:#222;margin:0}main{max-width:680px;margin:48px auto;background:#fff;padding:32px;border:1px solid #ddd}button{font:inherit;background:#116b38;color:white;border:0;padding:10px 18px;cursor:pointer}.status{margin-top:18px;padding:16px;border:1px solid #ddd;min-height:26px}</style></head>
<body><main><h1>The Boys in the Boat</h1><p>Product code: e10e1e165dc8be4a</p><p>Check the latest available copies before preparing a cart draft.</p><button id="refresh-stock" type="button">Check availability</button><div class="status" id="stock-status" role="status">Availability has not been checked.</div></main>
<script>document.getElementById('refresh-stock').addEventListener('click',async()=>{const box=document.getElementById('stock-status');box.textContent='Checking availability…';try{const response=await fetch('/api/catalogue/stock/boat-992',{cache:'no-store'});if(!response.ok)throw new Error('stock check failed');const data=await response.json();box.textContent=`${data.title}: ${data.available} copies available`;box.dataset.available=String(data.available);}catch(error){box.textContent='Availability could not be checked.';}});</script></body></html>
