<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>桌面设备部署看板 · VS Code</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:44px auto;padding:0 24px;color:#27333b}.card{border:1px solid #d4dfe7;border-radius:8px;padding:24px;background:#f8fbfd}#ram{font-size:28px;font-weight:700;color:#165d8a}</style></head>
<body><h1>桌面设备部署看板</h1><div class="card"><p>设备：研究室 768 MB 内存电脑</p><p>VS Code 官方建议内存：<span id="ram" aria-live="polite">正在读取…</span></p><p id="status">等待建议配置</p><a href="https://code.visualstudio.com/docs/supporting/requirements">打开官方要求页面</a></div><script>setTimeout(async()=>{const response=await fetch('/api/v1/requirements/vscode/desktop',{cache:'no-store'});if(!response.ok)throw new Error('requirements unavailable');const value=await response.json();document.getElementById('ram').textContent=value.recommended_ram_display;document.getElementById('status').textContent='建议配置已更新';},700);</script></body></html>
