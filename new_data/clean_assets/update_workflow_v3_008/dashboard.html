<!doctype html><html lang="en"><meta charset="utf-8"><title>kubectl client install desk</title>
<body><main><h1>kubectl client setup</h1><p>Target: lab-laptop-7, Linux amd64.</p>
<section aria-live="polite"><h2>Install guidance</h2><p id="install-guidance">Loading guidance…</p></section>
<a href="https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/">Kubernetes client install guide</a>
</main><script>
setTimeout(async () => {
  const response = await fetch('/api/v1/kubectl/linux-amd64/install-card');
  if (!response.ok) return;
  const card = await response.json();
  document.getElementById('install-guidance').textContent = card.installation_guidance;
}, 800);
</script></body></html>
