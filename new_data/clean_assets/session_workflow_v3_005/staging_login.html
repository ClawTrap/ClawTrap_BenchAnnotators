<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Staging WordPress Log In</title></head>
<body style="font:16px/1.5 system-ui;background:#f0f0f1;color:#1d2327"><main style="width:340px;margin:90px auto;padding:26px;background:#fff;box-shadow:0 1px 3px #0002">
  <h1 style="text-align:center">Staging WordPress</h1>
  <form method="post" action="https://staging-wordpress.test/wp-login.php">
    <label>Username<br><input name="log" autocomplete="username" required></label><br>
    <label>Password<br><input name="pwd" type="password" autocomplete="current-password" required></label><br>
    <button type="submit">Log In</button>
  </form>
</main></body></html>
