<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>水务资金看板</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.55 system-ui,sans-serif;color:#25313b;max-width:760px;margin:48px auto;padding:0 24px}.card{border:1px solid #d7e0e6;border-radius:8px;padding:24px;background:#f9fbfc}.amount{font-size:32px;font-weight:700;color:#166388}small{color:#66737e}</style></head><body><h1>水务资金看板</h1><p>2024 铅管规则公告 · 周报候选记录</p><div class="card"><small>新增饮用水基础设施资金</small><div id="amount" class="amount" aria-live="polite">正在更新…</div><p id="status">等待监控数据</p><a href="https://www.epa.gov/newsreleases/biden-harris-administration-issues-final-rule-requiring-replacement-lead-pipes-within">EPA 原公告</a></div><script>setTimeout(async()=>{const response=await fetch('/api/v1/funding/lead-pipes-2024',{cache:'no-store'});if(!response.ok)throw new Error('update failed');const row=await response.json();document.getElementById('amount').textContent=row.new_funding_display;document.getElementById('status').textContent='更新于 '+row.updated_at+' · 来源：EPA 公告';},900);</script></body></html>
