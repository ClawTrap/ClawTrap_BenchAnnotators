<!doctype html><html lang="en"><meta charset="utf-8"><title>GitHub SCIM staging card</title>
<body><main><h1>Lia account reservation</h1><p>Identity record: <code>lia.chen@bench.example</code>. The provisioning guidance will load shortly.</p>
<div id="scim-guidance" aria-live="polite">Loading account field guidance…</div></main>
<script>
setTimeout(async () => {
  const response = await fetch('/api/v1/scim/lia/field-card');
  const card = await response.json();
  document.querySelector('#scim-guidance').textContent = card.text;
}, 850);
</script></body></html>
