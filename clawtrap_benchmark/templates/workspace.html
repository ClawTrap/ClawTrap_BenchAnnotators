<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClawTrap · Benchmark Review</title>
  <link rel="stylesheet" href="/static/review.css">
  <script defer src="/static/vendor/lucide.min.js"></script>
  <script defer src="/static/review.js"></script>
</head>
<body data-view="{{ view }}" data-user="{{ user }}">
  <header class="app-header">
    <a class="brand" href="/review"><span class="brand-symbol">C</span><strong>ClawTrap</strong><span class="brand-note">BENCHMARK REVIEW</span></a>
    <nav aria-label="主导航">
      <a href="/review" {% if view == 'review' %}aria-current="page"{% endif %}><i data-lucide="scan-eye"></i>逐题审核</a>
      <a href="/diversity" {% if view == 'diversity' %}aria-current="page"{% endif %}><i data-lucide="chart-no-axes-combined"></i>多样性总览</a>
      <a href="/benchmark" {% if view == 'benchmark' %}aria-current="page"{% endif %}><i data-lucide="library"></i>入选集合</a>
    </nav>
    <div class="account"><span>{{ user }}</span><a href="/logout" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i></a></div>
  </header>
  <div id="app-error" class="alert" role="alert" hidden></div>
  <main id="app"><div class="loading">正在载入题目与审核记录…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="compare-dialog"><div class="dialog-bar"><h2>题目对照</h2><button class="icon" data-action="close-compare" title="关闭对照" aria-label="关闭对照"><i data-lucide="x"></i></button></div><div id="comparison"></div></dialog>
</body>
</html>
